<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God Says...</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>
    
    <main class="container">
        <header>
            <h1>God Says</h1>
            <p>A Web Port of Terry Davis's God Speaks</p>
        </header>

        <div class="controls">
            <label for="word-count">Number of words:</label>
            <input type="number" id="word-count" value="16" min="1" max="100">
            <button id="speak-btn">
                <span class="btn-text">Consult</span>
                <div class="btn-glow"></div>
            </button>
        </div>

        <div class="output-container">
            <div id="output" class="output-text">
                Waiting for divine inspiration...
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
